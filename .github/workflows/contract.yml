name: Contract

# Live contract tests: hit every exchange endpoint once and check the fields the
# parsers read, so payload drift shows up before a user reports it. Kept out of
# CI so `pnpm test` stays offline.
on:
  schedule:
    # Weekdays 10:17 UTC = 18:17 Taipei, after the close. Tests use the previous
    # trading day, so reports published in the evening are complete. Off the top
    # of the hour, when GitHub delays or drops the most scheduled runs (the
    # 10:00 run on 2026-11-27 never started).
    - cron: '17 10 * * 1-5'
  workflow_dispatch:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

concurrency:
  group: contract
  cancel-in-progress: false

jobs:
  live:
    name: Live contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs; the comment shows the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version pinned (with sha512) in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # --frozen-lockfile fails if pnpm-lock.yaml would change;
      # pnpm-workspace.yaml blocks install scripts and enforces the 7-day
      # minimum release age and the trust policy.
      - run: pnpm install --frozen-lockfile

      - run: pnpm test:live
