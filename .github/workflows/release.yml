name: Release

# Push a tag such as v0.1.1 to publish that version to npm.
# No secrets: npm trusted publishing exchanges the GitHub OIDC token for a
# short-lived publish token. Configure the trusted publisher on npmjs.com
# (allowing `npm publish`) before the first run.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version pinned (with sha512) in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check the tag matches package.json
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "")
            const version = require("./package.json").version
            if (version !== tag) throw new Error(`Tag v${tag} does not match package.json version ${version}`)
          '

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # --provenance attaches a signed build attestation.
      # --no-git-checks: a tag checkout is a detached HEAD, not the main branch.
      - name: Publish to npm
        run: pnpm publish --provenance --access public --no-git-checks
